# Full vLLM AMD agent-stack-k8s values (the PRODUCTION config — makes vLLM's default dind:true CI
# steps run). Adapted from the vLLM/AMD reference. One Helm release = ONE controller = ONE queue.
# Shape: docker:dind sidecar (the docker daemon vLLM's run-amd-test.sh needs) + container-0 =
# rocm/framework-automation (rocminfo + docker CLI + agent) + agent hooks (Docker Hub login +
# render-device metadata) + buildkite-sudoers. Proven on hardware (v1/sample pytest green on gfx950).
#
# PER-CLUSTER PLACEHOLDERS — fill all five with `sed` before `helm upgrade --install` (see install.md):
#   __QUEUE__         Buildkite queue this controller serves      e.g. amd_mi355_2
#   __GPU_COUNT__     whole GPUs per job pod (match the SKU)       e.g. 2
#   __MAX_IN_FLIGHT__ cap on concurrent job pods this controller  e.g. 8
#   __SCRATCH_ROOT__  node scratch MOUNT for caches + dind graph  e.g. /mnt/m2m_nobackup  (MUST be a
#                     real big-disk mount on every worker — a wrong path lands on the ~110Gi root fs
#                     via DirectoryOrCreate and evicts under load; verify with `mountpoint -q`)
#   __RENDER_GID__    GID of the render group that owns /dev/kfd  e.g. 992  (per cluster; find with
#                     `getent group render` or `stat -c %g /dev/kfd` on a GPU node — a wrong GID
#                     silently denies /dev/kfd so rocminfo sees no GPU)
#
# ADAPTATIONS vs the reference (WekaFS RWX + big local disks): caches (HF, docker layer) + dind
# /var/lib/docker -> per-node hostPath on __SCRATCH_ROOT__ (dind graph uses subPathExpr $(POD_NAME);
# NOT the reference's emptyDir w/ 1000Gi ephemeral, which fills the small root fs = eviction);
# git-mirrors dropped (no shared FS/warmer) -> pods clone fresh, blobless.
agentStackSecret: buildkite-agent-token

agent:
  extraEnvVars:
    - name: BUILDKITE_AGENT_USE_DOCKER
      value: "true"
    - name: BUILDKITE_AGENT_META_DATA_RESET_TARGET
      value: /opt/amdgpu/etc/gpu_state

config:
  pod-pending-timeout: 1200m
  job-ttl: 3m
  debug: true
  max-in-flight: __MAX_IN_FLIGHT__
  tags:
    - queue=__QUEUE__
  agent-config:
    hooksVolume:
      name: buildkite-hooks
      configMap:
        name: buildkite-agent-hooks
        defaultMode: 493
  pod-spec-patch:
    nodeSelector:
      spur.amd.com/compute: "true"
    securityContext:
      supplementalGroups: [__RENDER_GID__]   # /dev/kfd render group (per cluster; `getent group render`)
    shareProcessNamespace: true
    imagePullSecrets:
      - name: docker-config
    containers:
      - name: dind
        image: docker:dind
        securityContext:
          privileged: true
        env:
          - name: DOCKER_TLS_CERTDIR
            value: ""
          - name: POD_NAME
            valueFrom: { fieldRef: { fieldPath: metadata.name } }
        resources:
          requests: { cpu: "4000m", memory: 30Gi }
          limits: { cpu: "4000m", memory: 30Gi }
        volumeMounts:
          - { name: docker-socket, mountPath: /var/run }
          - { name: docker-data, mountPath: /var/lib/docker, subPathExpr: $(POD_NAME) }
          - { name: huggingface-storage, mountPath: /home/buildkite-agent/huggingface }
      - name: container-0
        image: rocm/framework-automation:rocm-7.2-ubuntu24-bk3.120.1
        imagePullPolicy: Always
        env:
          - name: HF_TOKEN
            valueFrom: { secretKeyRef: { name: hf-token, key: TOKEN } }
          - name: DOCKER_HOST
            value: 127.0.0.1
          - name: TINI_SUBREAPER
            value: "true"
        resources:
          # ephemeral-storage is the node ROOT fs (~110Gi/node here). The reference's 50Gi assumes
          # big local disks; on this cluster all heavy data (dind /var/lib/docker, HF + docker
          # caches) is on /mnt hostPaths, so real root-fs use per pod is a few GB (agent workspace +
          # logs). Reserving 50Gi jammed the fan-out at 1 pod/node. Request 10Gi (schedules ~4/node
          # into the ~50Gi free), cap at 30Gi as a runaway guard.
          requests: { cpu: "12000m", memory: 200Gi, ephemeral-storage: 10Gi, amd.com/gpu: "__GPU_COUNT__" }
          limits: { cpu: "12000m", memory: 200Gi, ephemeral-storage: 30Gi, amd.com/gpu: "__GPU_COUNT__" }
        volumeMounts:
          - { name: huggingface-storage, mountPath: /home/buildkite-agent/huggingface }
          - { name: docker-socket, mountPath: /var/run }
          - { name: docker-config, mountPath: /home/buildkite-agent/.docker/config.json, subPath: .dockerconfigjson }
          - { name: docker-cache, mountPath: /cached }
          - { name: buildkite-sudoers, mountPath: /etc/sudoers.d/buildkite-agent, subPath: buildkite-agent }
      - name: checkout
        resources:
          requests: { cpu: "1000m", memory: 1Gi, ephemeral-storage: 4Gi }
          limits: { cpu: "1000m", memory: 1Gi }
    volumes:
      - name: buildkite-sudoers
        configMap: { name: buildkite-sudoers, defaultMode: 0440 }
      - name: huggingface-storage
        hostPath: { path: __SCRATCH_ROOT__/hf-cache, type: DirectoryOrCreate }
      - name: docker-socket
        emptyDir: {}
      - name: docker-config
        secret: { secretName: docker-config }
      - name: docker-data
        hostPath: { path: __SCRATCH_ROOT__/bk-dind, type: DirectoryOrCreate }
      - name: docker-cache
        hostPath: { path: __SCRATCH_ROOT__/docker-cache, type: DirectoryOrCreate }
