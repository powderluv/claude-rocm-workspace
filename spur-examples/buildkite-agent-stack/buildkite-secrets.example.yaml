# TEMPLATE ONLY — do not commit real values. Prefer sealed-secrets or SOPS for the actual secrets.
# The full config (buildkite-vllm-values.yaml) hard-requires ALL THREE of these Secrets in the
# `buildkite` namespace, with these EXACT names + keys. A pod missing hf-token -> CreateContainerConfigError;
# missing docker-config -> ImagePullBackOff on the private container-0 image.
#
# Fastest path is the imperative commands at the bottom (docker-config especially — a dockerconfigjson
# is fiddly to hand-write). The stringData blocks below document the shape.
---
# 1) Buildkite CLUSTER AGENT token (per-cluster scope — this is the isolation boundary).
#    Key MUST be BUILDKITE_AGENT_TOKEN (the controller reads it via envFrom.secretRef).
apiVersion: v1
kind: Secret
metadata:
  name: buildkite-agent-token
  namespace: buildkite
type: Opaque
stringData:
  BUILDKITE_AGENT_TOKEN: "<CLUSTER_AGENT_TOKEN>"
---
# 2) HuggingFace token — injected as HF_TOKEN in container-0. Key MUST be TOKEN (uppercase).
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: buildkite
type: Opaque
stringData:
  TOKEN: "<hf_xxx>"
---
# 3) Docker Hub creds — used BOTH as an imagePullSecret (private container-0 / rocm images) AND
#    mounted as /home/buildkite-agent/.docker/config.json (the hooks read username/password from it
#    to `docker login`). MUST be a kubernetes.io/dockerconfigjson (key .dockerconfigjson).
apiVersion: v1
kind: Secret
metadata:
  name: docker-config
  namespace: buildkite
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"https://index.docker.io/v1/":{"username":"<DOCKERHUB_USER>","password":"<DOCKERHUB_PAT>","auth":"<base64 user:pat>"}}}
#
# ── Imperative equivalents (recommended; run once on the control host, KUBECONFIG set) ──────────────
#   kubectl create namespace buildkite   # if it doesn't exist
#
#   kubectl -n buildkite create secret generic buildkite-agent-token \
#     --from-literal=BUILDKITE_AGENT_TOKEN="$BUILDKITE_AGENT_TOKEN"
#
#   kubectl -n buildkite create secret generic hf-token \
#     --from-literal=TOKEN="$HF_TOKEN"
#
#   kubectl -n buildkite create secret docker-registry docker-config \
#     --docker-server=https://index.docker.io/v1/ \
#     --docker-username="$DOCKERHUB_USERNAME" --docker-password="$DOCKERHUB_TOKEN"
#
# ($BUILDKITE_AGENT_TOKEN / $HF_TOKEN / $DOCKERHUB_* can come from a sourced, chmod-600 env file.)
