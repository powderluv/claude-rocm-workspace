# Token-independent validation of the Buildkite native GPU pod shape on a SPUR MI355X cluster.
# Mirrors what agent-stack-k8s (and vLLM's dind:false native mode) creates: amd.com/gpu limit +
# devshm(Memory,16Gi) + GPU-node pin + supplementalGroups for /dev/kfd. Proves the device-plugin
# gives a pod gfx950 before any Buildkite involvement.
#
#   kubectl apply -f gpu-smoke.yaml
#   kubectl -n buildkite logs bk-gpu-smoke     # expect: gfx950, /dev/kfd, devshm 16G, scratch writable
#   kubectl -n buildkite delete pod bk-gpu-smoke
#
# EDIT FOR YOUR CLUSTER (this manifest is applied directly, NOT sed-templated):
#   - render GID 992  -> your cluster's /dev/kfd render group (`getent group render` on a GPU node)
#   - scratch /mnt/m2m_nobackup -> your node scratch mount
#   - image -> any ROCm image with rocminfo you can pull. rocm/framework-automation (the prod image)
#     is private -> needs the docker-config pull secret (drop imagePullSecrets if your image is public).
# Result on cluster-1 (2026-07-14): rocminfo -> gfx950; /dev/kfd + /dev/dri; devshm 16G; scratch writable.
apiVersion: v1
kind: Pod
metadata: { name: bk-gpu-smoke, namespace: buildkite }
spec:
  restartPolicy: Never
  nodeSelector: { spur.amd.com/compute: "true" }
  imagePullSecrets: [{ name: docker-config }]        # drop if your smoke image is public
  securityContext: { runAsUser: 0, seccompProfile: { type: Unconfined }, supplementalGroups: [44, 992] }   # 992 -> your render GID
  containers:
    - name: smoke
      image: rocm/framework-automation:rocm-7.2-ubuntu24-bk3.120.1
      imagePullPolicy: IfNotPresent
      command: ["bash", "-lc"]
      args:
        - |
          set -e
          echo "NODE=$(hostname)"
          echo "=== devices ==="; ls -l /dev/kfd /dev/dri | head
          echo "=== gfx ===";     (rocminfo || /usr/local/bin/rocminfo) 2>/dev/null | grep -E "Name:.*gfx" | head -4
          echo "=== devshm ===";  df -h /dev/shm | tail -1
          echo "=== scratch ==="; touch /mnt/hf/ok && echo WRITABLE; df -h /mnt/hf | tail -1
      resources: { limits: { amd.com/gpu: 1 } }
      volumeMounts:
        - { name: devshm, mountPath: /dev/shm }
        - { name: hf-cache, mountPath: /mnt/hf }
  volumes:
    - { name: devshm, emptyDir: { medium: Memory, sizeLimit: 16Gi } }
    - { name: hf-cache, hostPath: { path: /mnt/m2m_nobackup/hf-cache, type: DirectoryOrCreate } }   # -> your scratch mount
